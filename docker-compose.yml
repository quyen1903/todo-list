version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - ./data:/usr/src/app/data  # SQLite persistent storage
    ports:
      - "3000:3000"
    command: npm run dev
    environment:
      - "NODE_ENV=development"
      - "PORT=3000"
      - "DATABASE_URL=file:/usr/src/app/data/database.sqlite"
    restart: unless-stopped
